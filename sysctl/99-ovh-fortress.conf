# Source and route validation. Loose reverse-path filtering is intentional:
# strict mode can break WireGuard/Tailscale and asymmetric OVH routing.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.ens3.rp_filter = 2
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.ens3.log_martians = 1

net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# TCP resilience. Syncookies are an overflow fallback, not a substitute for
# upstream scrubbing or measured backlog sizing.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 8192
net.ipv4.tcp_synack_retries = 3
net.ipv4.tcp_rfc1337 = 1

# Reject bogus broadcast/error traffic in the IP stack.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Conntrack. Keep the larger table: the previous file set this and the kernel
# default is lower. Do not create state from stray mid-flow TCP packets.
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_loose = 0
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 10
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 15
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close = 10
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 15
net.netfilter.nf_conntrack_udp_timeout = 10
net.netfilter.nf_conntrack_udp_timeout_stream = 30
net.netfilter.nf_conntrack_icmp_timeout = 5

# Limit the stack's own ACK/RST reactions under a mixed flood.
# icmp_ratelimit is left at the kernel default (1000 ms between replies);
# a lower number allows MORE replies, not fewer.
net.ipv4.tcp_challenge_ack_limit = 100
net.ipv4.tcp_invalid_ratelimit = 500
net.core.netdev_max_backlog = 4096

# Preserve the server's current WireGuard gateway behavior.
net.ipv4.ip_forward = 1
